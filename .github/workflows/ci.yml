name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Market index points at a matching commit
        run: node scripts/check-market-index.mjs

      - name: Build client bundle
        run: node scripts/build-client.mjs

      - name: Client bundle is current
        run: git diff --exit-code -- client.js

      - name: Lint
        run: npm run lint

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check panel/panel.js
          node --check runtime/electron-helper/main.cjs
          node --check runtime/electron-helper/platform.cjs
          node --check runtime/electron-helper/preload.cjs
          node --check scripts/backup.mjs
          node --check scripts/sync-github.mjs
          node --check scripts/make-market-index.mjs

      - name: Client bundle envelope
        run: node test/client-bundle.test.mjs

      - name: Source imports
        run: node test/source-imports.test.mjs

      - name: Host regression tests
        run: node test/host.test.mjs

      - name: Adapter tests
        run: node test/dsh-adapter.test.mjs

      - name: Platform rules
        run: node test/platform.test.mjs

      - name: Runtime provisioning
        run: node test/runtime-install.test.mjs

      - name: Cache Electron for the helper smoke test
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/.dsh/electron
          key: electron-43.3.0-${{ runner.arch }}

      - name: Install Electron for the helper smoke test
        if: runner.os == 'macOS'
        run: |
          if [ ! -x "$HOME/.dsh/electron/Electron.app/Contents/MacOS/Electron" ]; then
            case "$(uname -m)" in
              arm64) archive=electron-v43.3.0-darwin-arm64.zip ;;
              *) archive=electron-v43.3.0-darwin-x64.zip ;;
            esac
            mkdir -p "$HOME/.dsh/electron"
            curl -L --fail -o /tmp/electron.zip "https://github.com/electron/electron/releases/download/v43.3.0/$archive"
            unzip -q -o /tmp/electron.zip -d "$HOME/.dsh/electron"
          fi

      - name: Real helper launch smoke test
        if: runner.os == 'macOS'
        run: env -u ELECTRON_RUN_AS_NODE node test/helper.test.mjs

      - name: Package contents
        run: npm pack --dry-run

      - name: Market index is valid
        run: |
          node -e "const j = require('./market/index.json'); if (j.format !== 1 || !Array.isArray(j.plugins) || j.plugins.length === 0) process.exit(1)"
